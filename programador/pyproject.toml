[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-programador"
version = "0.1.0"
description = "Agente Programador: aplica correções de código numa branch Git isolada e confirma num commit automático."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agente Programador Team" }]
keywords = ["git", "gitpython", "multi-agent", "langgraph", "hermes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "pydantic>=2.5,<3.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
agente-programador = "agente_programador.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_programador*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

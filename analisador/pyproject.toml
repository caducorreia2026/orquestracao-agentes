[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-analisador"
version = "0.1.0"
description = "Agente Analisador: executa pytest num repositório local e devolve erros estruturados em JSON compatível com Hermes/LangGraph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agente Analisador Team" }]
keywords = ["pytest", "multi-agent", "langgraph", "hermes", "subprocess"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
agente-analisador = "agente_analisador.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agente_analisador*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

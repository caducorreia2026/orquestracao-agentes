[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-teste-desconto"
version = "0.1.0"
description = "Repositório de teste para o Agente Analisador (função de desconto com bugs intencionais)."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# Configuração do pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-v --tb=long -rA"
pythonpath = ["."]   # permite `from src.discount import ...`

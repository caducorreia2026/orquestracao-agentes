[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orquestrador-central"
version = "0.1.0"
description = "Orquestrador Central: grafo LangGraph que coordena analisador, gestor, programador e revisor/testador."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Moreira da Silva" }]
keywords = ["langgraph", "multi-agent", "hermes", "pytest", "orchestrator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.5,<3.0",
    "typing_extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
orquestrador = "orquestrador.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orquestrador*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
